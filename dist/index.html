    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;

      /* ─ Keyframe library ─ */
      @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp   { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideInLeft  { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes slideInRight { from { opacity: 0; transform: translateX(28px);  } to { opacity: 1; transform: translateX(0); } }
      @keyframes scaleUp   { from { opacity: 0; transform: scale(0.93); } to { opacity: 1; transform: scale(1); } }
      @keyframes float     { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }
      @keyframes ticker    { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
      @keyframes pulseGlow {
        0%  { box-shadow: 0 0 0 0   rgba(212,160,23,.5); }
        70% { box-shadow: 0 0 0 14px rgba(212,160,23,0); }
        100%{ box-shadow: 0 0 0 0   rgba(212,160,23,0); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes logoBreathe {
        0%,100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(217,119,6,.45), 0 4px 14px rgba(0,0,0,.15); }
        50%     { transform: scale(1.07); box-shadow: 0 0 0 8px rgba(217,119,6,0),  0 6px 22px rgba(217,119,6,.35); }
      }
      .animate-logo { animation: logoBreathe 3.2s ease-in-out infinite; }

      /* ─ Utility classes ─ */
      .animate-fadeIn      { animation: fadeIn   0.6s ease-out; }
      .animate-slideUp     { animation: slideUp  0.6s ease-out; }
      .animate-scaleUp     { animation: scaleUp  0.35s cubic-bezier(.16,1,.3,1); }
      .animate-pulse-glow  { animation: pulseGlow 2.5s infinite; }
      .animate-float       { animation: float    4s ease-in-out infinite; }
      .animate-ticker      { animation: ticker   40s linear infinite; }
      .animate-slideInLeft  { animation: slideInLeft  0.6s ease-out; }
      .animate-slideInRight { animation: slideInRight 0.6s ease-out; }

      /* ─ Scroll-reveal ─ */
      .reveal       { opacity: 0; transform: translateY(32px);  transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
      .reveal-left  { opacity: 0; transform: translateX(-32px); transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
      .reveal-right { opacity: 0; transform: translateX(32px);  transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
      .reveal.visible, .reveal-left.visible, .reveal-right.visible { opacity: 1; transform: none; }

      /* ─ Gold gradient text ─ */
      .text-gold-gradient {
        background: linear-gradient(135deg, #f5d97a 0%, #d4a017 50%, #c09020 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ─ Glassmorphism ─ */
      .glass {
        background: rgba(255,255,255,.06);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,.12);
      }

      /* ─ Gold divider ─ */
      .divider-gold { height: 2px; background: linear-gradient(90deg, transparent, #d4a017, transparent); }

      /* ─ Custom scrollbar ─ */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #d4a017; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #c09020; }

      /* ─ Hero overlay ─ */
      .hero-overlay { background: linear-gradient(to right, rgba(10,22,40,.93) 0%, rgba(10,22,40,.7) 55%, rgba(10,22,40,.25) 100%); }

      /* ─ Ticker ─ */
      .ticker-wrap { overflow: hidden; white-space: nowrap; }
      .ticker-item { display: inline-flex; align-items: center; gap: 1.5rem; padding-right: 3rem; }

      /* ─ Card hover lift ─ */
      .card-lift { transition: transform .3s ease, box-shadow .3s ease; }
      .card-lift:hover { transform: translateY(-6px); box-shadow: 0 24px 48px rgba(0,0,0,.12); }

      .bg-navy-gradient { background: linear-gradient(135deg, #0a1628 0%, #162447 50%, #0a1628 100%); }

      .stagger-children > *:nth-child(4) { transition-delay: .3s; }
